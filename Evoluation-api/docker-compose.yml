services:
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Sysmax2026
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --requirepass Sysmax2026
    volumes:
      - evolution_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Sysmax2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    # Patcha DATABASE_CONNECTION_URI no .env interno antes de iniciar
    # (runWithProvider.js lê do .env e ignora variáveis do Docker)
    # Patcha main.js (bundle real) para suporte a @lid JIDs (WhatsApp Advanced Privacy)
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -i '/^DATABASE_CONNECTION_URI=/d' /evolution/.env
        echo 'DATABASE_CONNECTION_URI=postgresql://postgres:Sysmax2026@evolution-postgres:5432/evolution?schema=public' >> /evolution/.env
        MAIN=/evolution/dist/main.js
        sed -i 's/let t={groups:\[\],broadcast:\[\],users:\[\]}/let t={groups:[],broadcast:[],users:[],lid:[]}/' $$MAIN
        sed -i 's/g===\"status@broadcast\"?t\.broadcast\.push({number:u,jid:g}):t\.users\.push({number:u,jid:g})/g==="status@broadcast"?t.broadcast.push({number:u,jid:g}):g.includes("@lid")?t.lid.push({number:u,jid:g}):t.users.push({number:u,jid:g})/g' $$MAIN
        sed -i 's/s\.push(\.\.\.t\.broadcast\.map(({jid:u,number:g})=>new ct(u,!1,g)));/s.push(...t.broadcast.map(({jid:u,number:g})=>new ct(u,!1,g)));s.push(...t.lid.map(({jid:u,number:g})=>new ct(u,!0,g)));/g' $$MAIN
        sed -i 's/!n\.jid\.includes("@broadcast"))throw new f(n)/\!n.jid.includes("@broadcast")\&\&!n.jid.includes("@lid"))throw new f(n)/g' $$MAIN
        npm run db:deploy && npm run db:generate && npm run start:prod
    environment:
      - SERVER_URL=https://wpp.sysmaxsolutions.com
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=Sysmax@2026#
      # Database
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:Sysmax2026@evolution-postgres:5432/evolution?schema=public
      # Cache Redis
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:Sysmax2026@evolution-redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      # CORS — obrigatório (sem optional chaining no código fonte)
      - CORS_ORIGIN=*
      - CORS_METHODS=POST,GET,PUT,DELETE
      - CORS_CREDENTIALS=true
      # Log — obrigatório (split sem null-check)
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS,WEBSOCKET
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      # WhatsApp — versão fixa evita fingerprint com kernel WSL2
      - CONFIG_SESSION_PHONE_CLIENT=SysVetMax
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CONFIG_SESSION_PHONE_VERSION=6.0.0
    volumes:
      - ./evolution_instances:/evolution/instances

volumes:
  evolution_pgdata:
  evolution_redisdata:
