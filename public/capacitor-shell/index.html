<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>SysVetMax</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    body {
      background:
        radial-gradient(circle at 30% 20%, rgba(20,184,166,0.35) 0%, transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(45,212,191,0.25) 0%, transparent 50%),
        linear-gradient(135deg, #0f172a 0%, #134e4a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage { text-align: center; }
    .logo-wrap {
      width: 120px; height: 120px;
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      animation: pop 0.7s cubic-bezier(.34,1.56,.64,1) both,
                 float 3.5s ease-in-out 0.7s infinite;
    }
    .logo-wrap svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 24px rgba(20,184,166,0.45)); }
    .title {
      font-size: 26px; font-weight: 700; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #5eead4, #ffffff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      opacity: 0; transform: translateY(8px);
      animation: rise 0.6s ease-out 0.35s forwards;
    }
    .tag {
      margin-top: 6px; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase;
      color: #5eead4; opacity: 0;
      animation: rise 0.6s ease-out 0.55s forwards;
    }
    .progress {
      margin-top: 32px; width: 140px; height: 3px;
      background: rgba(94,234,212,0.15); border-radius: 3px; overflow: hidden;
      position: relative; mx: auto;
    }
    .progress::after {
      content: ''; position: absolute; left: -40%; top: 0; height: 100%; width: 40%;
      background: linear-gradient(90deg, transparent, #5eead4, transparent);
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes pop {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-6px); }
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slide {
      to { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="logo-wrap">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"  stop-color="#5eead4"/>
            <stop offset="100%" stop-color="#14b8a6"/>
          </linearGradient>
          <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"  stop-color="#a7f3d0"/>
            <stop offset="100%" stop-color="#5eead4"/>
          </linearGradient>
        </defs>
        <g transform="translate(58 56) scale(0.5) translate(-50 -50)" opacity="0.6">
          <ellipse cx="27" cy="32" rx="10" ry="13" fill="url(#g2)" transform="rotate(-18 27 32)"/>
          <ellipse cx="44" cy="23" rx="10" ry="13" fill="url(#g2)" transform="rotate(-6 44 23)"/>
          <ellipse cx="61" cy="23" rx="10" ry="13" fill="url(#g2)" transform="rotate(6 61 23)"/>
          <ellipse cx="78" cy="32" rx="10" ry="13" fill="url(#g2)" transform="rotate(18 78 32)"/>
          <ellipse cx="52" cy="67" rx="26" ry="22" fill="url(#g2)"/>
        </g>
        <g transform="translate(38 44) scale(0.85) translate(-50 -50)">
          <ellipse cx="27" cy="32" rx="10" ry="13" fill="url(#g1)" transform="rotate(-18 27 32)"/>
          <ellipse cx="44" cy="23" rx="10" ry="13" fill="url(#g1)" transform="rotate(-6 44 23)"/>
          <ellipse cx="61" cy="23" rx="10" ry="13" fill="url(#g1)" transform="rotate(6 61 23)"/>
          <ellipse cx="78" cy="32" rx="10" ry="13" fill="url(#g1)" transform="rotate(18 78 32)"/>
          <ellipse cx="52" cy="67" rx="26" ry="22" fill="url(#g1)"/>
          <ellipse cx="45" cy="58" rx="14" ry="9" fill="#a7f3d0" opacity="0.4"/>
        </g>
      </svg>
    </div>
    <div class="title">SysVetMax</div>
    <div class="tag">Cuidando do seu pet</div>
    <div class="progress"></div>
  </div>
</body>
</html>
