<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>SysVetMax</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    body {
      background:
        radial-gradient(circle at 30% 20%, rgba(74,222,128,0.30) 0%, transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(37,99,235,0.28) 0%, transparent 50%),
        linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage { text-align: center; }
    .logo-wrap {
      width: 120px; height: 120px;
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      animation: pop 0.7s cubic-bezier(.34,1.56,.64,1) both,
                 float 3.5s ease-in-out 0.7s infinite;
    }
    .logo-wrap svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 24px rgba(34,197,94,0.45)); }
    .title {
      font-size: 26px; font-weight: 700; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #86efac, #ffffff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      opacity: 0; transform: translateY(8px);
      animation: rise 0.6s ease-out 0.35s forwards;
    }
    .tag {
      margin-top: 6px; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase;
      color: #86efac; opacity: 0;
      animation: rise 0.6s ease-out 0.55s forwards;
    }
    .progress {
      margin-top: 32px; width: 140px; height: 3px;
      background: rgba(134,239,172,0.18); border-radius: 3px; overflow: hidden;
      position: relative; mx: auto;
    }
    .progress::after {
      content: ''; position: absolute; left: -40%; top: 0; height: 100%; width: 40%;
      background: linear-gradient(90deg, transparent, #86efac, transparent);
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes pop {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-6px); }
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slide {
      to { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="logo-wrap">
      <img src="brand-logo.png" alt="SysVetMax" draggable="false"
           style="width: 100%; height: 100%; object-fit: contain;"/>
    </div>
    <div class="title">SysVetMax</div>
    <div class="tag">Cuidando do pet e de você</div>
    <div class="progress"></div>
  </div>
</body>
</html>
