<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pawGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="ecgNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="ecgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- Patinha verde (dedinhos + pad central) -->
  <g>
    <ellipse cx="27" cy="32" rx="10" ry="13" fill="url(#pawGreen)" transform="rotate(-18 27 32)"/>
    <ellipse cx="44" cy="23" rx="10" ry="13" fill="url(#pawGreen)" transform="rotate(-6 44 23)"/>
    <ellipse cx="61" cy="23" rx="10" ry="13" fill="url(#pawGreen)" transform="rotate(6 61 23)"/>
    <ellipse cx="78" cy="32" rx="10" ry="13" fill="url(#pawGreen)" transform="rotate(18 78 32)"/>
    <ellipse cx="52" cy="67" rx="28" ry="23" fill="url(#pawGreen)"/>
  </g>

  <!-- Halo branco da linha ECG (cria separação visual contra o verde) -->
  <path
    d="M 4 60 L 26 60 L 30 56 L 34 62 L 38 60 L 41 56 L 45 28 L 50 82 L 55 48 L 60 62 L 64 60 L 80 60 L 84 50 L 92 50"
    stroke="white" stroke-width="6" fill="none"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Linha ECG azul marinho -->
  <path
    d="M 4 60 L 26 60 L 30 56 L 34 62 L 38 60 L 41 56 L 45 28 L 50 82 L 55 48 L 60 62 L 64 60 L 80 60 L 84 50 L 92 50"
    stroke="url(#ecgNavy)" stroke-width="3.2" fill="none"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#ecgGlow)"/>

  <!-- Seta no final da linha ECG (estilo "tendência saudável crescendo") -->
  <path
    d="M 88 54 L 94 48 L 88 42 M 94 48 L 84 48"
    stroke="white" stroke-width="6" fill="none"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <path
    d="M 88 54 L 94 48 L 88 42 M 94 48 L 84 48"
    stroke="url(#ecgNavy)" stroke-width="3.2" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
